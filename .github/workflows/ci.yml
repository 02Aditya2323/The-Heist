name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build deployable application
        run: npm run build:deploy
      - name: Client type check
        run: npx tsc -p apps/client/tsconfig.json --noEmit
      - name: Protocol and simulation tests
        run: npm run test:shared
      - name: Server authority, auth and SQLite regressions
        run: npm run test:server
      - name: Closed dialogs remain hidden
        run: node tools/check-dialog-visibility.mjs
