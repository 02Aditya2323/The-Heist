# Install in /etc/nginx/snippets/heist-staff.conf (server context).
#
# Publicly proxies the authenticated staff and organizer API so the event can be
# run from a browser over HTTPS.
#
# WHY THIS EXISTS, AND WHAT IT CHANGES
#
# The player snippet is deny-by-default and withholds these routes, on the
# assumption that an organizer reaches them through an SSH port forward. That is
# the stronger posture and it remains the right default for an unattended
# deployment. It is not workable for this event: the person running it is not a
# developer, and an SSH tunnel on the day is a single point of failure nobody
# present could repair.
#
# Including this snippet is therefore a deliberate, documented trade:
#
#   - The real access control is unchanged and is server-side. Every one of
#     these routes resolves the bearer token to an account and re-checks that
#     account's role from the database on every request. The super-admin routes
#     additionally require role === 'superadmin'. A public user cannot gain
#     staff access by editing frontend storage.
#   - It is only acceptable over TLS. These requests carry a session bearer
#     token, so this snippet must never be included in a plaintext server block.
#     Install it only alongside the HTTPS template.
#   - Access logging stays off, inherited from the player snippet, because these
#     URLs and query strings can carry session credentials.
#
# Routes deliberately still NOT proxied: /metrics, /health, the debug endpoints,
# the painter, and the filesystem root. Those have no authentication of their
# own and are reachable from the VM itself when an administrator needs them.

# Organizer: dashboard, start/pause/resume/freeze/announce/release/reset.
location = /api/admin/event { proxy_pass http://127.0.0.1:8080; }
# Organizer: live settings metadata and updates.
location = /api/admin/settings { proxy_pass http://127.0.0.1:8080; }
# Organizer: per-operator money, penalty and hold actions.
location = /api/admin/player { proxy_pass http://127.0.0.1:8080; }
# Organizer: registered-account roster, and its CSV export via ?format=csv.
location = /api/admin/roster { proxy_pass http://127.0.0.1:8080; }
# Organizer: one operator's transaction history. Bounded to an id segment so
# this cannot be used to reach any other admin path.
location ~ "^/api/admin/history/[A-Za-z0-9_-]{1,64}$" { proxy_pass http://127.0.0.1:8080; }

# Staff challenge review: unpaid previews that change no player progression.
location = /api/staff/challenges { proxy_pass http://127.0.0.1:8080; }
location = /api/staff/challenges/open { proxy_pass http://127.0.0.1:8080; }
location = /api/staff/challenges/action { proxy_pass http://127.0.0.1:8080; }
