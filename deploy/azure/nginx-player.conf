# Install in /etc/nginx/snippets/heist-player.conf (server context).
client_max_body_size 16k;
server_tokens off;
# /ws query strings contain credentials: never enable request access logs here.
access_log off;
# Error logs can also include request URLs. Discard them for this credential-bearing
# virtual host; diagnose via local isolated QA / private application logs instead.
error_log /dev/null crit;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $heist_connection_upgrade;
proxy_read_timeout 75s;
proxy_send_timeout 75s;

# Match only literal raw asset names, not decoded/normalized traversal paths.
# The query suffix is allowed for cache-busting; it does not affect the filename.
set $heist_asset_uri_ok 0;
if ($request_uri ~ "^/(assets|art)/[A-Za-z0-9_/-]+\.(js|css|json|png|webp|svg|ico|jpg|jpeg|avif|woff|woff2)(\?.*)?$") {
    set $heist_asset_uri_ok 1;
}

location = / { proxy_pass http://127.0.0.1:8080; }
# Read-only spectator board for a projector. Public on purpose: it holds no
# session and every figure on it is already visible to every player in the HUD.
location = /board { proxy_pass http://127.0.0.1:8080; }
location = /board.html { proxy_pass http://127.0.0.1:8080; }
location = /api/board { proxy_pass http://127.0.0.1:8080; }
location = /ws { proxy_pass http://127.0.0.1:8080; }
location = /api/register { proxy_pass http://127.0.0.1:8080; }
location = /api/login { proxy_pass http://127.0.0.1:8080; }
location = /api/map { proxy_pass http://127.0.0.1:8080; }
location = /api/event { proxy_pass http://127.0.0.1:8080; }
location = /api/account { proxy_pass http://127.0.0.1:8080; }

location ~ "^/(assets|art)/[A-Za-z0-9_/-]+\.(js|css|json|png|webp|svg|ico|jpg|jpeg|avif|woff|woff2)$" {
    if ($heist_asset_uri_ok = 0) { return 404; }
    proxy_pass http://127.0.0.1:8080;
}

# No public admin/staff HTTP, diagnostics, painter, config, or filesystem root.
location / { return 404; }
